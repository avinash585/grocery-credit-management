services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: grammart
      MYSQL_USER: grammart
      MYSQL_PASSWORD: grammart_dev_password
      MYSQL_ROOT_PASSWORD: root_dev_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: grammart
      DB_USERNAME: grammart
      DB_PASSWORD: grammart_dev_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: local-development-secret-change-before-production-64-characters
    ports:
      - "8080:8080"

volumes:
  mysql_data:

