spring:
  datasource:
    url: jdbc:mysql://localhost:3306/grammart?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:grammart}
    password: ${DB_PASSWORD:grammart_dev_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    url: ${spring.datasource.url}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate

management:
  health:
    redis:
      enabled: false

